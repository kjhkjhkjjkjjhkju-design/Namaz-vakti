name: Namaz Vakti APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # İmza anahtarı cache'te saklanır: her derlemede aynı imza -> APK'yı silmeden güncelleyebilirsin
      - name: Anahtar önbelleği
        uses: actions/cache@v4
        with:
          path: k.jks
          key: namaz-keystore-v1

      - name: Proje dosyalarını oluştur
        run: |
          mkdir -p res/drawable res/layout src/com/veysel/namaz gen out cls

          cat > AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.veysel.namaz">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
            <application android:label="Namaz Vakti" android:icon="@drawable/ic_launcher"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar" android:allowBackup="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <receiver android:name=".Rcv" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED"/>
                  <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                  <action android:name="android.intent.action.TIME_SET"/>
                  <action android:name="android.intent.action.TIMEZONE_CHANGED"/>
                </intent-filter>
              </receiver>
            </application>
          </manifest>
          EOF

          cat > res/drawable/ic_stat.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M12,3c-4.97,0 -9,4.03 -9,9s4.03,9 9,9s9,-4.03 9,-9c0,-0.46 -0.04,-0.92 -0.1,-1.36c-0.98,1.37 -2.58,2.26 -4.4,2.26c-2.98,0 -5.4,-2.42 -5.4,-5.4c0,-1.81 0.89,-3.42 2.26,-4.4C12.92,3.04 12.46,3 12,3L12,3z"/>
          </vector>
          EOF

          cat > res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#000000" android:pathData="M12,0a12,12 0 1,0 0.001,0z"/>
            <group android:scaleX="0.6" android:scaleY="0.6" android:pivotX="12" android:pivotY="12">
              <path android:fillColor="#FF9800" android:pathData="M12,3c-4.97,0 -9,4.03 -9,9s4.03,9 9,9s9,-4.03 9,-9c0,-0.46 -0.04,-0.92 -0.1,-1.36c-0.98,1.37 -2.58,2.26 -4.4,2.26c-2.98,0 -5.4,-2.42 -5.4,-5.4c0,-1.81 0.89,-3.42 2.26,-4.4C12.92,3.04 12.46,3 12,3L12,3z"/>
            </group>
          </vector>
          EOF

          # Küçük (kapalı) bildirim görünümü
          cat > res/layout/ns.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="horizontal" android:gravity="center_vertical"
              android:background="#000000"
              android:paddingLeft="12dp" android:paddingRight="12dp" android:paddingTop="6dp" android:paddingBottom="6dp">
            <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                android:layout_weight="1" android:orientation="vertical">
              <TextView android:id="@+id/a" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textColor="#FF9800" android:textSize="16dp" android:textStyle="bold" android:singleLine="true"/>
              <TextView android:id="@+id/b" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textColor="#8A8A8A" android:textSize="12dp" android:singleLine="true"/>
            </LinearLayout>
            <Chronometer android:id="@+id/c1" android:layout_width="wrap_content" android:layout_height="wrap_content"
                android:textColor="#FFFFFF" android:textSize="24dp" android:textStyle="bold"/>
          </LinearLayout>
          EOF

          # Büyük (açık) bildirim görünümü: üstte kalan süre, altında 6 vakit (2 satır x 3 sütun)
          cat > res/layout/nb.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="vertical" android:background="#000000" android:padding="12dp">
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                android:orientation="horizontal" android:gravity="center_vertical">
              <TextView android:id="@+id/ta" android:layout_width="0dp" android:layout_height="wrap_content"
                  android:layout_weight="1" android:textColor="#FF9800" android:textSize="12dp" android:textStyle="bold"
                  android:singleLine="true" android:ellipsize="end"/>
              <Chronometer android:id="@+id/c1" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textColor="#FFFFFF" android:textSize="24dp" android:textStyle="bold"/>
            </LinearLayout>
          EOF
          for r in 0 1; do
          cat >> res/layout/nb.xml <<EOF
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                android:orientation="horizontal" android:layout_marginTop="10dp">
          EOF
          for c in 0 1 2; do
          i=$((r*3+c))
          cat >> res/layout/nb.xml <<EOF
              <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                  android:layout_weight="1" android:orientation="vertical" android:gravity="center_horizontal">
                <TextView android:id="@+id/n$i" android:layout_width="wrap_content" android:layout_height="wrap_content"
                    android:textColor="#FFFFFF" android:textSize="12dp" android:singleLine="true"/>
                <TextView android:id="@+id/v$i" android:layout_width="wrap_content" android:layout_height="wrap_content"
                    android:textColor="#FFFFFF" android:textSize="20dp" android:textStyle="bold" android:singleLine="true"/>
              </LinearLayout>
          EOF
          done
          cat >> res/layout/nb.xml <<'EOF'
            </LinearLayout>
          EOF
          done
          cat >> res/layout/nb.xml <<'EOF'
          </LinearLayout>
          EOF


          cat > src/com/veysel/namaz/Rcv.java <<'EOF'
          package com.veysel.namaz;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class Rcv extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent i) {
              Core.update(c);
            }
          }
          EOF

          cat > src/com/veysel/namaz/Core.java <<'EOF'
          package com.veysel.namaz;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.SystemClock;
          import android.util.TypedValue;
          import android.widget.RemoteViews;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileReader;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.List;
          import java.util.Locale;
          import java.util.TimeZone;

          public class Core {
            static final String CH = "vakit2", TICK = "com.veysel.namaz.TICK";
            static final String[] N = {"İmsak", "Güneş", "Öğle", "İkindi", "Akşam", "Yatsı"};
            static final String[] U = {"İMSAK", "GÜNEŞ", "ÖĞLE", "İKİNDİ", "AKŞAM", "YATSI"};
            static final String[] L = {"İMSAK EZANINA KALAN", "GÜNEŞ DOĞUŞUNA KALAN", "ÖĞLE EZANINA KALAN",
                "İKİNDİ EZANINA KALAN", "AKŞAM EZANINA KALAN", "YATSI EZANINA KALAN"};
            static final int OR = 0xFFFF9800, WH = 0xFFFFFFFF, DIM = 0xFF8A8A8A;
            static final TimeZone TZ = TimeZone.getTimeZone("Europe/Istanbul");

            static File f(Context c) { return new File(c.getFilesDir(), "d.txt"); }

            // Her satır: yyyyMMdd,imsak,güneş,öğle,ikindi,akşam,yatsı
            static List<String[]> load(Context c) {
              List<String[]> r = new ArrayList<>();
              try (BufferedReader br = new BufferedReader(new FileReader(f(c)))) {
                String s;
                while ((s = br.readLine()) != null) {
                  String[] p = s.split(",");
                  if (p.length == 7) r.add(p);
                }
              } catch (Exception e) { }
              return r;
            }

            static String key() {
              Calendar c = Calendar.getInstance(TZ);
              return String.format(Locale.US, "%04d%02d%02d", c.get(Calendar.YEAR), c.get(Calendar.MONTH) + 1, c.get(Calendar.DAY_OF_MONTH));
            }

            static long ms(String d, String t) {
              Calendar c = Calendar.getInstance(TZ);
              c.clear();
              c.set(Integer.parseInt(d.substring(0, 4)), Integer.parseInt(d.substring(4, 6)) - 1, Integer.parseInt(d.substring(6, 8)),
                  Integer.parseInt(t.substring(0, 2)), Integer.parseInt(t.substring(3, 5)), 0);
              return c.getTimeInMillis();
            }

            static int[] next(List<String[]> rows, long now) {
              for (int i = 0; i < rows.size(); i++)
                for (int j = 0; j < 6; j++)
                  if (ms(rows.get(i)[0], rows.get(i)[j + 1]) > now) return new int[]{i, j};
              return null;
            }

            static PendingIntent tick(Context c, int code) {
              return PendingIntent.getBroadcast(c, code, new Intent(c, Rcv.class).setAction(TICK),
                  PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
            }

            static void update(Context c) {
              try {
                doUpdate(c);
                c.getSharedPreferences("p", 0).edit().remove("err").apply();
              } catch (Throwable e) {
                c.getSharedPreferences("p", 0).edit().putString("err", String.valueOf(e)).apply();
              }
            }

            static void doUpdate(Context c) {
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              PendingIntent alarm = tick(c, 1);
              List<String[]> rows = load(c);
              long now = System.currentTimeMillis();
              int[] n = rows.isEmpty() ? null : next(rows, now);
              // Veri yok / veri bitti / izin yok -> bildirim yok, alarm yok
              if (n == null || !nm.areNotificationsEnabled()) {
                nm.cancel(1);
                am.cancel(alarm);
                return;
              }
              String[] row = rows.get(n[0]);
              int j = n[1];
              String tm = row[j + 1];
              long t = ms(row[0], tm);
              long base = SystemClock.elapsedRealtime() + (t - now);

              nm.deleteNotificationChannel("vakit");
              NotificationChannel ch = new NotificationChannel(CH, "Namaz vakitleri", NotificationManager.IMPORTANCE_DEFAULT);
              ch.setShowBadge(false);
              ch.setSound(null, null);
              ch.enableVibration(false);
              ch.enableLights(false);
              ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
              nm.createNotificationChannel(ch);

              RemoteViews s = new RemoteViews(c.getPackageName(), R.layout.ns);
              s.setTextViewText(R.id.a, U[j] + "  " + tm);
              s.setTextViewText(R.id.b, j == 1 ? "doğuşuna kalan" : "ezanına kalan");
              s.setChronometerCountDown(R.id.c1, true);
              s.setChronometer(R.id.c1, base, null, true);

              int[] NI = {R.id.n0, R.id.n1, R.id.n2, R.id.n3, R.id.n4, R.id.n5};
              int[] VI = {R.id.v0, R.id.v1, R.id.v2, R.id.v3, R.id.v4, R.id.v5};
              RemoteViews big = new RemoteViews(c.getPackageName(), R.layout.nb);
              big.setTextViewText(R.id.ta, L[j]);
              big.setChronometerCountDown(R.id.c1, true);
              big.setChronometer(R.id.c1, base, null, true);
              for (int i = 0; i < 6; i++) {
                boolean past = ms(row[0], row[i + 1]) <= now;
                int col = i == j ? OR : (past ? DIM : WH);
                big.setTextViewText(NI[i], N[i]);
                big.setTextViewText(VI[i], row[i + 1]);
                big.setTextColor(NI[i], col);
                big.setTextColor(VI[i], col);
                if (i == j) big.setTextViewTextSize(VI[i], TypedValue.COMPLEX_UNIT_DIP, 24);
              }

              PendingIntent open = PendingIntent.getActivity(c, 3, new Intent(c, MainActivity.class),
                  PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              Notification nt = new Notification.Builder(c, CH)
                  .setSmallIcon(R.drawable.ic_stat)
                  .setContentTitle(N[j] + " " + tm)
                  .setColor(OR)
                  .setStyle(new Notification.DecoratedCustomViewStyle())
                  .setCustomContentView(s)
                  .setCustomBigContentView(big)
                  .setOngoing(true)
                  .setOnlyAlertOnce(true)
                  .setShowWhen(false)
                  .setVisibility(Notification.VISIBILITY_PUBLIC)
                  .setContentIntent(open)
                  .setDeleteIntent(tick(c, 2)) // kullanıcı kaydırıp silerse tekrar gönderir
                  .build();
              nm.notify(1, nt);

              long at = t + 1000;
              if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms())
                am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, alarm);
              else
                am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, alarm);
            }
          }
          EOF

          cat > src/com/veysel/namaz/MainActivity.java <<'EOF'
          package com.veysel.namaz;

