              "Kars,40.60,43.10", "Kastamonu,41.38,33.78", "Kayseri,38.73,35.49", "Kilis,36.72,37.12",
              "Kırıkkale,39.85,33.52", "Kırklareli,41.74,27.23", "Kırşehir,39.15,34.17", "Kocaeli,40.77,29.94",
              "Konya,37.87,32.48", "Kütahya,39.42,29.98", "Malatya,38.35,38.31", "Manisa,38.61,27.43",
              "Mardin,37.31,40.74", "Mersin,36.80,34.64", "Muğla,37.22,28.36", "Muş,38.74,41.49",
              "Nevşehir,38.62,34.71", "Niğde,37.97,34.68", "Ordu,40.98,37.88", "Osmaniye,37.07,36.25",
              "Rize,41.02,40.52", "Sakarya,40.76,30.40", "Samsun,41.29,36.33", "Siirt,37.93,41.94",
              "Sinop,42.03,35.15", "Sivas,39.75,37.02", "Şanlıurfa,37.16,38.79", "Şırnak,37.52,42.46",
              "Tekirdağ,41.00,27.51", "Tokat,40.31,36.55", "Trabzon,41.00,39.72", "Tunceli,39.11,39.55",
              "Uşak,38.68,29.41", "Van,38.50,43.37", "Yalova,40.65,29.27", "Yozgat,39.82,34.81", "Zonguldak,41.46,31.80"
            };

            TextView st, td;
            Spinner sp;
            Button bt;
            SharedPreferences pr;

            int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

            TextView tv(String s, int sz, int col, boolean bold) {
              TextView t = new TextView(this);
              t.setText(s);
              t.setTextSize(sz);
              t.setTextColor(col);
              if (bold) t.setTypeface(null, Typeface.BOLD);
              return t;
            }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              pr = getSharedPreferences("p", 0);
              int p = dp(20);
              LinearLayout r = new LinearLayout(this);
              r.setOrientation(LinearLayout.VERTICAL);
              r.setBackgroundColor(0xFF000000);
              r.setPadding(p, p, p, p);

              r.addView(tv("Namaz Vakti", 28, 0xFFFF9800, true));
              TextView sub = tv("Türkiye · Diyanet yöntemi", 14, 0xFF8A8A8A, false);
              sub.setPadding(0, 0, 0, dp(16));
              r.addView(sub);

              String[] nm = new String[C.length];
              for (int i = 0; i < C.length; i++) nm[i] = C[i].split(",")[0];
              sp = new Spinner(this);
              ArrayAdapter<String> ad = new ArrayAdapter<>(this, android.R.layout.simple_spinner_item, nm);
              ad.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
              sp.setAdapter(ad);
              sp.setSelection(Math.min(pr.getInt("ci", 0), C.length - 1));
              r.addView(sp);

              bt = new Button(this);
              bt.setText("Veriyi Çek (1 yıllık)");
              bt.setOnClickListener(v -> fetchAll());
              r.addView(bt);

              Button sb = new Button(this);
              sb.setText("Bildirim / kilit ekranı ayarları");
              sb.setOnClickListener(v -> {
                try {
                  startActivity(new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS)
                      .putExtra(Settings.EXTRA_APP_PACKAGE, getPackageName()));
                } catch (Exception e) {
                  startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                      android.net.Uri.parse("package:" + getPackageName())));
                }
              });
              r.addView(sb);

              st = tv("", 14, 0xFF8A8A8A, false);
              st.setPadding(0, dp(12), 0, 0);
              r.addView(st);
              td = tv("", 20, 0xFFFFFFFF, true);
              td.setPadding(0, dp(16), 0, 0);
              r.addView(td);

              View sp2 = new View(this);
              r.addView(sp2, new LinearLayout.LayoutParams(1, 0, 1f));
              TextView ft = tv("Yapımcı: Veysel Alemdar", 13, 0xFF8A8A8A, false);
              ft.setGravity(Gravity.CENTER);
              r.addView(ft, new LinearLayout.LayoutParams(-1, -2));
              setContentView(r);

              if (Build.VERSION.SDK_INT >= 33
                  && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED)
                requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
            }

            @Override protected void onResume() {
              super.onResume();
              Core.update(this);
              refresh();
            }

            @Override public void onRequestPermissionsResult(int code, String[] p, int[] g) {
              Core.update(this);
              refresh();
            }

            static String fmt(String s) { return s.substring(6, 8) + "." + s.substring(4, 6) + "." + s.substring(0, 4); }

            void refresh() {
              List<String[]> rows = Core.load(this);
              String diag = "";
              if (!((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).areNotificationsEnabled())
                diag += "\nBildirimler KAPALI. Aşağıdaki ayar butonundan aç.";
              String er0 = pr.getString("err", null);
              if (er0 != null) diag += "\nBildirim hatası: " + er0;
              if (rows.isEmpty()) {
                st.setText("Henüz veri yok. Şehir seç ve veriyi çek." + diag);
                td.setText("");
                return;
              }
              String msg = pr.getString("city", "") + "\nVeri: " + fmt(rows.get(0)[0]) + " – "
                  + fmt(rows.get(rows.size() - 1)[0]) + " (" + rows.size() + " gün)";
              if (Core.next(rows, System.currentTimeMillis()) == null)
                msg += "\nVeri bitti, bildirim kapalı. Tekrar veri çek.";
              st.setText(msg + diag);
              String today = Core.key();
              StringBuilder sb = new StringBuilder();
              for (String[] w : rows)
                if (w[0].equals(today))
                  for (int j = 0; j < 6; j++) sb.append(Core.N[j]).append("   ").append(w[j + 1]).append("\n");
              td.setText(sb.toString().trim());
            }

            void post(String s) { runOnUiThread(() -> st.setText(s)); }

            void fetchAll() {
              final int idx = sp.getSelectedItemPosition();
              bt.setEnabled(false);
              new Thread(() -> {
                String err = null;
                try { fetch(idx); } catch (Exception e) { err = "Hata: " + e.getMessage(); }
                final String er = err;
                runOnUiThread(() -> {
                  bt.setEnabled(true);
                  if (er != null) { st.setText(er); return; }
                  pr.edit().putInt("ci", idx).putString("city", C[idx].split(",")[0]).apply();
                  Core.update(this);
                  refresh();
                });
              }).start();
            }

            void fetch(int idx) throws Exception {
              String[] cc = C[idx].split(",");
              Calendar cal = Calendar.getInstance(Core.TZ);
              int y = cal.get(Calendar.YEAR), m = cal.get(Calendar.MONTH) + 1;
              String today = Core.key();
              List<String> out = new ArrayList<>();
              for (int k = 0; k < 13 && out.size() < 365; k++) {
                post("İndiriliyor " + (k + 1) + "/13 ...");
                String u = "https://api.aladhan.com/v1/calendar/" + y + "/" + m + "?latitude=" + cc[1]
                    + "&longitude=" + cc[2] + "&method=13&timezonestring=Europe/Istanbul";
                JSONArray a = new JSONObject(get(u)).getJSONArray("data");
                for (int i = 0; i < a.length() && out.size() < 365; i++) {
                  JSONObject o = a.getJSONObject(i);
                  String[] d = o.getJSONObject("date").getJSONObject("gregorian").getString("date").split("-");
                  String key = d[2] + d[1] + d[0];
                  if (key.compareTo(today) < 0) continue;
                  JSONObject t = o.getJSONObject("timings");
                  out.add(key + "," + h(t, "Fajr") + "," + h(t, "Sunrise") + "," + h(t, "Dhuhr") + ","
                      + h(t, "Asr") + "," + h(t, "Maghrib") + "," + h(t, "Isha"));
                }
                if (++m > 12) { m = 1; y++; }
                Thread.sleep(300);
              }
              if (out.size() < 300) throw new Exception("Veri eksik geldi, tekrar dene");
              File tmp = new File(getFilesDir(), "d.tmp");
              try (PrintWriter w = new PrintWriter(tmp, "UTF-8")) {
                for (String s : out) w.println(s);
              }
              if (!tmp.renameTo(Core.f(this))) throw new IOException("Kaydedilemedi");
            }

            static String h(JSONObject t, String k) throws Exception { return t.getString(k).substring(0, 5); }

            String get(String u) throws Exception {
              Exception last = null;
              for (int a = 0; a < 3; a++) {
                try {
                  HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(20000);
                  if (c.getResponseCode() != 200) throw new IOException("HTTP " + c.getResponseCode());
                  BufferedReader br = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  String s;
                  while ((s = br.readLine()) != null) sb.append(s);
                  br.close();
                  c.disconnect();
                  return sb.toString();
                } catch (Exception e) {
                  last = e;
                  Thread.sleep(1500);
                }
              }
              throw last;
            }
          }
          EOF

      - name: Derle ve imzala
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK"/build-tools/[0-9]* | sort -V | tail -1)
          JAR=$(ls -d "$SDK"/platforms/android-[0-9][0-9] | sort -V | tail -1)/android.jar
          echo "build-tools: $BT"; echo "platform: $JAR"

          "$BT/aapt2" compile --dir res -o res.zip
          "$BT/aapt2" link -o base.apk -I "$JAR" --manifest AndroidManifest.xml --java gen \
            --min-sdk-version 24 --target-sdk-version 34 --version-code 1 --version-name 1.0 res.zip

          javac -encoding UTF-8 --release 8 -classpath "$JAR" -d cls $(find gen src -name '*.java')
          "$BT/d8" --release --min-api 24 --lib "$JAR" --output out $(find cls -name '*.class')

          cp base.apk app.apk
          (cd out && zip -j ../app.apk classes.dex)
          "$BT/zipalign" -f -p 4 app.apk aligned.apk

          [ -f k.jks ] || keytool -genkeypair -keystore k.jks -alias k -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass namaz123 -keypass namaz123 -dname "CN=Veysel Alemdar"
          "$BT/apksigner" sign --ks k.jks --ks-pass pass:namaz123 --key-pass pass:namaz123 \
            --out namaz-vakti.apk aligned.apk
          ls -l namaz-vakti.apk

      - uses: actions/upload-artifact@v4
        with:
          name: namaz-vakti
          path: namaz-vakti.apk

      # Telefondan kolay indirmek için Release olarak da yayınlar
      - name: Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" namaz-vakti.apk \
            --repo "$GITHUB_REPOSITORY" --target "${{ github.sha }}" \
            --title "Namaz Vakti v${{ github.run_number }}" --notes "Yapımcı: Veysel Alemdar"
